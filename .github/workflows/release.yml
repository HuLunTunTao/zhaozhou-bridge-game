name: Build & Release

on:
  push:
    tags:
      - "v*"

env:
  GODOT_VERSION: "4.6.1"

jobs:
  export:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - preset: "Linux"
            artifact: "linux"
            path: "build/linux"
          - preset: "Windows"
            artifact: "windows"
            path: "build/windows"
          - preset: "macOS"
            artifact: "macos"
            path: "build/macos"
    container:
      image: barichello/godot-ci:4.6.1
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable 2>/dev/null || true
          ls /root/.local/share/godot/export_templates/ || true

      - name: Import project
        run: godot --headless --import --quit 2>/dev/null || true

      - name: Export ${{ matrix.preset }}
        run: |
          mkdir -p ${{ matrix.path }}
          godot --headless --export-release "${{ matrix.preset }}" 2>/dev/null || true

      - name: Archive build
        run: |
          cd ${{ matrix.path }}
          zip -r /tmp/${{ matrix.artifact }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/${{ matrix.artifact }}.zip

  release:
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            artifacts/linux/linux.zip
            artifacts/windows/windows.zip
            artifacts/macos/macos.zip
